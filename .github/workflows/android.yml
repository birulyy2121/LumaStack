name: Android build

permissions:
  contents: write

on:
  push:
    tags:
      - 'preview-v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable test APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LumaStack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare public preview asset
        if: startsWith(github.ref, 'refs/tags/preview-v')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LumaStack-preview.apk
          sha256sum LumaStack-preview.apk > SHA256SUMS.txt
      - name: Publish public preview release
        if: startsWith(github.ref, 'refs/tags/preview-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" LumaStack-preview.apk SHA256SUMS.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" LumaStack-preview.apk SHA256SUMS.txt \
              --prerelease \
              --title "LumaStack preview ${GITHUB_REF_NAME}" \
              --notes "Early test APK for Android 10+. Download LumaStack-preview.apk and allow installation from your browser or Files app. This is a debug-signed preview and has not been device-tested; future release-signed builds may require uninstalling this preview first. Photos are processed on-device."
          fi
