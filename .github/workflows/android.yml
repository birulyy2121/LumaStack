name: Android build

permissions:
  contents: write

on:
  push:
    tags:
      - 'preview-v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable test APK
        run: gradle assembleLegacyDebug assembleModernDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LumaStack-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
      - name: Prepare public preview asset
        if: startsWith(github.ref, 'refs/tags/preview-v')
        run: |
          cp app/build/outputs/apk/legacy/debug/app-legacy-debug.apk LumaStack-Android6-9.apk
          cp app/build/outputs/apk/modern/debug/app-modern-debug.apk LumaStack-Android10-plus.apk
          sha256sum LumaStack-Android6-9.apk LumaStack-Android10-plus.apk > SHA256SUMS.txt
      - name: Publish public preview release
        if: startsWith(github.ref, 'refs/tags/preview-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" LumaStack-Android6-9.apk LumaStack-Android10-plus.apk SHA256SUMS.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" LumaStack-Android6-9.apk LumaStack-Android10-plus.apk SHA256SUMS.txt \
              --prerelease \
              --title "LumaStack preview ${GITHUB_REF_NAME}" \
              --notes "Early test APKs with an in-app automatic camera. Choose LumaStack-Android6-9.apk for Android 6 through 9, or LumaStack-Android10-plus.apk for Android 10 and newer. These are debug-signed previews; future release-signed builds may require uninstalling them first. Photos are processed on-device."
          fi
