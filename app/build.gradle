plugins { id 'com.android.application' }

android {
    namespace 'com.lumastack.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lumastack.app'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.2.0'
    }

    flavorDimensions 'androidRange'
    productFlavors {
        legacy {
            dimension 'androidRange'
            minSdk 23
            versionNameSuffix '-android6-9'
        }
        modern {
            dimension 'androidRange'
            minSdk 29
            versionNameSuffix '-android10-plus'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
